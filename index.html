<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Horaire tactile</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
  color: #222;
  touch-action: manipulation;
}

header {
  background: white;
  padding: 12px;
  border-bottom: 1px solid #ccc;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

button {
  font-size: 18px;
  padding: 10px 18px;
  border: 1px solid #999;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

button:active {
  background: #ddd;
}

#weekTitle {
  font-size: 24px;
  font-weight: bold;
  min-width: 300px;
  text-align: center;
}

.schedule-wrap {
  overflow-x: auto;
  padding: 12px;
}

table {
  width: 100%;
  min-width: 1000px;
  border-collapse: collapse;
  table-layout: fixed;
  background: white;
}

th, td {
  border: 2px solid #555;
}

th {
  background: #e9e9e9;
  height: 55px;
  font-size: 20px;
}

.team-cell {
  width: 160px;
  padding: 6px;
  background: #f5f5f5;
}

.team-name {
  width: 100%;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  background: transparent;
  text-align: center;
  padding: 8px 4px;
}

.job-cell {
  height: 110px;
  vertical-align: middle;
  text-align: center;
  padding: 6px;
  cursor: pointer;
  position: relative;
}

.job-cell:active {
  background: #eee;
}

.cell-text {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: "Comic Sans MS", "Segoe Print", cursive;
  font-size: 21px;
  line-height: 1.15;
}

/* ÉDITEUR */

#editorOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 1000;
  padding: 20px;
}

#editorBox {
  width: 100%;
  height: 100%;
  max-width: 1200px;
  margin: auto;
  background: white;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#editorHeader {
  padding: 12px 16px;
  background: #eee;
  font-size: 22px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#canvasWrap {
  flex: 1;
  position: relative;
  background:
    repeating-linear-gradient(
      white,
      white 49px,
      #d9e4f2 50px
    );
  overflow: hidden;
}

#writingCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#editorTools {
  padding: 12px;
  background: #eee;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

#recognizeBtn {
  background: #dff1df;
}

#doneBtn {
  background: #d9e9ff;
  font-weight: bold;
}

#status {
  padding: 5px 12px;
  min-height: 28px;
  text-align: center;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <div class="topbar">
    <button id="prevWeek">◀ Semaine précédente</button>
    <div id="weekTitle"></div>
    <button id="nextWeek">Semaine suivante ▶</button>
  </div>
</header>

<div class="schedule-wrap">
<table>
  <thead>
    <tr>
      <th>Équipe</th>
      <th>Lundi</th>
      <th>Mardi</th>
      <th>Mercredi</th>
      <th>Jeudi</th>
      <th>Vendredi</th>
      <th>Samedi</th>
      <th>Dimanche</th>
    </tr>
  </thead>
  <tbody id="scheduleBody"></tbody>
</table>
</div>

<div id="editorOverlay">
  <div id="editorBox">

    <div id="editorHeader">
      <span id="editorTitle">Écriture</span>
      <button id="cancelBtn">✕ Fermer</button>
    </div>

    <div id="canvasWrap">
      <canvas id="writingCanvas"></canvas>
    </div>

    <div id="status"></div>

    <div id="editorTools">
      <button id="penBtn">✏️ Crayon</button>
      <button id="eraserBtn">🧽 Efface</button>
      <button id="clearBtn">🗑 Effacer tout</button>
      <button id="recognizeBtn">✨ Reconnaître l'écriture</button>
      <button id="doneBtn">✓ Terminé</button>
    </div>

  </div>
</div>

<script>
const WORKER_URL =
  "https://horaire-myscript.francis-g-berube.workers.dev/";

const DAYS = [
  "Lundi",
  "Mardi",
  "Mercredi",
  "Jeudi",
  "Vendredi",
  "Samedi",
  "Dimanche"
];

const TEAM_COUNT = 6;
const STORAGE_KEY = "horaireTactile";

let data = loadData();
let currentWeek = getMonday(new Date());
let selectedTeam = null;
let selectedDay = null;

let canvas;
let ctx;

let drawing = false;
let erasing = false;

let strokes = [];
let currentStroke = null;

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      teams: [
        "Équipe 1",
        "Équipe 2",
        "Équipe 3",
        "Équipe 4",
        "Équipe 5",
        "Équipe 6"
      ],
      weeks: {}
    };
  } catch {
    return {
      teams: [
        "Équipe 1",
        "Équipe 2",
        "Équipe 3",
        "Équipe 4",
        "Équipe 5",
        "Équipe 6"
      ],
      weeks: {}
    };
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);

  d.setHours(12,0,0,0);
  d.setDate(diff);

  return d;
}

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function formatDate(date) {
  return date.toLocaleDateString(
    "fr-CA",
    {
      day: "numeric",
      month: "long"
    }
  );
}

function weekKey() {
  return dateKey(currentWeek);
}

function ensureWeek() {
  const key = weekKey();

  if (!data.weeks[key]) {
    data.weeks[key] = {};

    for (let team = 0; team < TEAM_COUNT; team++) {
      data.weeks[key][team] = {};

      for (let day = 0; day < 7; day++) {
        data.weeks[key][team][day] = {
          text: ""
        };
      }
    }

    saveData();
  }
}

function render() {
  ensureWeek();

  const sunday = new Date(currentWeek);
  sunday.setDate(sunday.getDate() + 6);

  document.getElementById("weekTitle").textContent =
    `Semaine du ${formatDate(currentWeek)} au ${formatDate(sunday)}`;

  const body = document.getElementById("scheduleBody");
  body.innerHTML = "";

  for (let team = 0; team < TEAM_COUNT; team++) {

    const tr = document.createElement("tr");

    const teamCell = document.createElement("td");
    teamCell.className = "team-cell";

    const input = document.createElement("input");
    input.className = "team-name";
    input.value = data.teams[team] || `Équipe ${team+1}`;

    input.addEventListener("change", () => {
      data.teams[team] = input.value;
      saveData();
    });

    teamCell.appendChild(input);
    tr.appendChild(teamCell);

    for (let day = 0; day < 7; day++) {

      const td = document.createElement("td");
      td.className = "job-cell";

      const text = document.createElement("div");
      text.className = "cell-text";

      const cellData =
        data.weeks[weekKey()][team][day];

      text.textContent = cellData.text || "";

      td.appendChild(text);

      td.addEventListener("click", () => {
        openEditor(team, day);
      });

      tr.appendChild(td);
    }

    body.appendChild(tr);
  }
}

document.getElementById("prevWeek")
.addEventListener("click", () => {
  currentWeek.setDate(currentWeek.getDate() - 7);
  currentWeek = new Date(currentWeek);
  render();
});

document.getElementById("nextWeek")
.addEventListener("click", () => {
  currentWeek.setDate(currentWeek.getDate() + 7);
  currentWeek = new Date(currentWeek);
  render();
});

/* ==============================
   ÉDITEUR D'ÉCRITURE
================================ */

const overlay =
  document.getElementById("editorOverlay");

canvas =
  document.getElementById("writingCanvas");

ctx =
  canvas.getContext("2d");

function resizeCanvas() {
  const rect =
    document.getElementById("canvasWrap")
    .getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.round(rect.width * ratio);

  canvas.height =
    Math.round(rect.height * ratio);

  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}

function openEditor(team, day) {

  selectedTeam = team;
  selectedDay = day;

  strokes = [];
  currentStroke = null;

  document.getElementById("editorTitle")
  .textContent =
    `${data.teams[team]} — ${DAYS[day]}`;

  document.getElementById("status")
  .textContent =
    "Écris avec le S Pen, puis appuie sur « Reconnaître l'écriture ».";

  overlay.style.display = "block";

  setTimeout(() => {
    resizeCanvas();
    clearCanvasOnly();
  }, 50);
}

function closeEditor() {
  overlay.style.display = "none";
}

function clearCanvasOnly() {
  const rect = canvas.getBoundingClientRect();

  ctx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );
}

function getPoint(event) {

  const rect =
    canvas.getBoundingClientRect();

  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top,
    t: Date.now()
  };
}

canvas.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    canvas.setPointerCapture(
      event.pointerId
    );

    drawing = true;

    const p = getPoint(event);

    if (erasing) {

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.lineWidth = 30;

    } else {

      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle = "#111";
      ctx.lineWidth = 3;

      currentStroke = {
        x: [p.x],
        y: [p.y],
        t: [0]
      };

      currentStroke.startTime = p.t;
    }

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
);

canvas.addEventListener(
  "pointermove",
  event => {

    if (!drawing) return;

    event.preventDefault();

    const p = getPoint(event);

    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    if (
      !erasing &&
      currentStroke
    ) {

      currentStroke.x.push(p.x);
      currentStroke.y.push(p.y);

      currentStroke.t.push(
        p.t -
        currentStroke.startTime
      );
    }
  }
);

function stopDrawing(event) {

  if (!drawing) return;

  drawing = false;

  ctx.closePath();

  if (
    !erasing &&
    currentStroke &&
    currentStroke.x.length > 0
  ) {

    delete currentStroke.startTime;

    strokes.push(currentStroke);
  }

  currentStroke = null;
}

canvas.addEventListener(
  "pointerup",
  stopDrawing
);

canvas.addEventListener(
  "pointercancel",
  stopDrawing
);

document.getElementById("penBtn")
.addEventListener("click", () => {

  erasing = false;

  document.getElementById("status")
  .textContent = "Crayon activé.";
});

document.getElementById("eraserBtn")
.addEventListener("click", () => {

  erasing = true;

  document.getElementById("status")
  .textContent =
    "Efface activée. Pour la reconnaissance, utilise « Effacer tout » si tu recommences complètement.";
});

document.getElementById("clearBtn")
.addEventListener("click", () => {

  strokes = [];
  currentStroke = null;

  clearCanvasOnly();

  document.getElementById("status")
  .textContent = "Zone effacée.";
});

document.getElementById("cancelBtn")
.addEventListener("click", closeEditor);

/* ==============================
   RECONNAISSANCE MYSCRIPT
================================ */

async function recognizeWriting() {

  const status =
    document.getElementById("status");

  if (!strokes.length) {

    status.textContent =
      "Écris quelque chose avant de lancer la reconnaissance.";

    return;
  }

  status.textContent =
    "Reconnaissance de l'écriture en cours…";

  const rect =
    canvas.getBoundingClientRect();

  const requestBody = {
    scaleX: 1,
    scaleY: 1,
    contentType: "Text",

    configuration: {
      lang: "fr_FR"
    },

    width: rect.width,
    height: rect.height,

    strokes: strokes
  };

  try {

    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              requestBody
            )
        }
      );

    const raw =
      await response.text();

    if (!response.ok) {
      throw new Error(raw);
    }

    let recognizedText = "";

    try {

      const result =
        JSON.parse(raw);

      recognizedText =
        result.label ||
        result.text ||
        result.recognizedText ||
        "";

      if (
        !recognizedText &&
        result.words
      ) {
        recognizedText =
          result.words
          .map(w =>
            w.label || w.text || ""
          )
          .join(" ");
      }

    } catch {

      recognizedText = raw;
    }

    recognizedText =
      recognizedText.trim();

    if (!recognizedText) {

      status.textContent =
        "MyScript a répondu, mais aucun texte n'a été reconnu.";

      return;
    }

    data.weeks[weekKey()]
      [selectedTeam]
      [selectedDay]
      .text =
        recognizedText;

    saveData();

    status.textContent =
      `Reconnu : ${recognizedText}`;

    render();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Erreur de reconnaissance. Nous vérifierons la connexion au Worker.";
  }
}

document.getElementById("recognizeBtn")
.addEventListener(
  "click",
  recognizeWriting
);

document.getElementById("doneBtn")
.addEventListener(
  "click",
  () => {
    saveData();
    render();
    closeEditor();
  }
);

window.addEventListener(
  "resize",
  () => {
    if (
      overlay.style.display ===
      "block"
    ) {
      resizeCanvas();
    }
  }
);

render();
</script>

</body>
</html>
